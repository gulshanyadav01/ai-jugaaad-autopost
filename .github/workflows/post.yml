name: Post next Reel

on:
  schedule:
    # ~12:35, 18:35 and 21:35 IST (cron is UTC). Off the top of the hour,
    # because GitHub delays or drops scheduled runs most around :00.
    - cron: "4 7 * * *"
    - cron: "4 13 * * *"
    - cron: "4 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (check setup, post nothing)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          VIDEO_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reels
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: python post.py
      - name: Save queue
        if: success()
        run: |
          git config user.name "ai-jugaaad-bot"
          git config user.email "actions@users.noreply.github.com"
          git add queue.json
          git diff --cached --quiet || (git commit -m "Posted next Reel" && git push)
