name: Post next Reel

on:
  schedule:
    # Backup timer only. cron-job.org triggers the exact 12:30 / 18:30 / 21:30 IST runs;
    # these fire ~20 min later and skip themselves if that slot already posted.
    - cron: "19 7 * * *"
    - cron: "19 13 * * *"
    - cron: "19 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (check setup, post nothing)"
        type: boolean
        default: true
      force:
        description: "Post even if this time slot already has a post"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          VIDEO_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reels
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
        run: python post.py
      - name: Save queue
        if: success()
        run: |
          git config user.name "ai-jugaaad-bot"
          git config user.email "actions@users.noreply.github.com"
          git add queue.json
          git diff --cached --quiet || (git commit -m "Posted next Reel" && git push)
