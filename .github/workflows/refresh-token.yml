name: Refresh Instagram token

# Instagram long-lived tokens expire after 60 days. This renews it every Monday
# and saves the new one back into the repo secret (needs the GH_PAT secret).
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: r
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          REFRESH_ONLY: "1"
        run: python post.py
      - name: Save new token
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW: ${{ steps.r.outputs.token }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "GH_PAT not set: token refreshed but not saved. Renew manually before 60 days."; exit 0; fi
          printf '%s' "$NEW" | gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}"
          echo "Saved refreshed token."
